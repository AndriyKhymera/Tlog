[project]
name = "tlog"
version = "0.1.0"
description = "A CLI time tracker with extensible reporter plugins"
authors = [
    {name = "Andrii Khymera",email = "ext-andrii.khymera@here.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer (>=0.24.1,<0.25.0)",
    "rich (>=14.3.3,<15.0.0)"
]

[project.scripts]
tlog = "tlog.main:main"


[tool.poetry]
packages = [{include = "tlog", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-snapshot (>=0.9.0,<0.10.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
